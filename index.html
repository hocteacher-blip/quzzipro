    <meta name="description" content="Nền tảng tổ chức trò chơi, thi đấu và kiểm tra kiến thức trực tuyến thời gian thực dành cho giáo viên và học sinh." />
    <meta property="og:title" content="QUIZZI ARENA PRO — Đấu Trường Tri Thức Trực Tuyến" />

    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function () {
        try {
          var currentFetch = window.fetch ? window.fetch.bind(window) : undefined;
          if (currentFetch) {
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function () {
                return currentFetch;
              },
              set: function (fn) {
                if (typeof fn === 'function') {
                  currentFetch = fn;
                }
              },
            });
          }
        } catch (_e) {}

        window.addEventListener(
          'error',
          function (event) {
            if (
              (event && event.filename && event.filename.indexOf('chrome-extension://') === 0) ||
              (event &&
                event.message &&
                event.message.indexOf('Cannot set property fetch of #<Window>') !== -1)
            ) {
              event.stopImmediatePropagation();
              event.preventDefault();
            }
          },
          true
        );
      })();
    </script>
